<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Reading List</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
<h1>Book List:</h1>
<ol>
    <li th:each ="book : ${bookList}">
        <span th:text="'&quot;'+${book.title}+'&quot;'"></span>
        <span th:text="' - by ' + ${book.author}"></span>
    </li>
</ol>
<!--<p th:text="${bookList}" />-->
</body>
</html>
