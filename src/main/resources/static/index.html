<body style="margin-left:25px">
<h1>Book List Service</h1>
<form action="/books/list">
    <div class="form-group mb-2">
        <label for="numBooks" class="col-form-label-lg">Please input the number of books:</label>
        <input type="number" class="form-control-lg" id="numBooks" name="numBooks" value="numBooks" placeholder="Default: 10">
        <br/>
        <br/>
        <label class="col-form-label-lg">Please select some categories:</label><br/>
        <input type="checkbox" name="listCategories" value="hardcover-fiction"> Fiction<br>
        <input type="checkbox" name="listCategories" value="hardcover-nonfiction"> Nonfiction<br>
        <input type="checkbox" name="listCategories" value="hardcover-advice"> Advice<br>
        <input type="checkbox" name="listCategories" value="paperback-graphic-books"> Graphic Novels<br>
        <input type="checkbox" name="listCategories" value="young-adult"> Young Adult<br>
        <input type="checkbox" name="listCategories" value="business-books"> Business<br>
        <input type="checkbox" name="listCategories" value="food-and-fitness"> Food and Diet<br>
        <input type="checkbox" name="listCategories" value="sports"> Sports and Fitness<br>
        <input type="checkbox" name="listCategories" value="humor"> Humor<br>
        <input type="checkbox" name="listCategories" value="science"> Science<br>
        <input type="checkbox" name="listCategories" value="travel"> Travel<br>
    </div>
    <br/>
    <button type="submit" class="btn btn-primary mb-2">GetBookList!</button>
</form>

<br/>

<form name="getBookInfoList" action="/ws" method="post">
    <div>
        <textarea id="xmlText" rows="10" cols="75"></textarea>
        <br/>
        <input type="button" class="btn btn-primary mb-2" value="Soap" onclick="soap();" />
    </div>
</form>

<script type="text/javascript">
    var exampleText= "<Envelope xmlns=\"http://schemas.xmlsoap.org/soap/envelope/\">\n" +
        "    <Body>\n" +
        "        <GetBooksInfosByTitlesRequest xmlns=\"http://project1.ericss.com/bookInfo\">\n" +
        "            <titleList>\n" +
        "                <title>Becoming</title>\n" +
        "            </titleList>\n" +
        "        </GetBooksInfosByTitlesRequest>\n" +
        "    </Body>\n" +
        "</Envelope>";
    document.getElementById('xmlText').innerHTML = exampleText;
</script>
<script type="text/javascript">
    function soap() {
        var xmlhttp = new XMLHttpRequest();
        xmlhttp.open('POST', 'http://localhost:8080/ws', true);
        var xml = document.getElementById("xmlText").value;
        xmlhttp.onreadystatechange = function () {
            if (xmlhttp.readyState == 4) {
                if (xmlhttp.status == 200) {
                    alert(xmlhttp.responseText);
                }
            }
        };
        xmlhttp.setRequestHeader('Content-Type', 'text/xml');
        xmlhttp.send(xml);
    };
</script>
</body>
